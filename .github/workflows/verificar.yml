name: verificar
on: [push, pull_request]
jobs:
  nos:
    name: no (${{ matrix.python }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix: {python: ["3.11", "3.12", "3.13", "3.14"], arch: [x64, arm64]}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    env: {PYTHONUTF8: "1"}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: pins sha256 (falha se qualquer byte mudar)
        run: |
          cat > pins.sha256 <<'PINS'
          d4a28760b347321df1d877133782ad2d3dc8982bea9677558021827a4afe205c  tpl_cadeia.py
          bba1fefc316ed7f14db428b854ffc7b5f1a87220c317e68b866a94d2048ab9ec  tpl_malha_v0_3.py
          b9f837cade6b7377c099873f041db325ebda77c8b3122b1ea9bb880a10eabf89  tpl_arbitro_v3.py
          f4624b6aa070a07413fe9552493390ea3a97c47bf45ae2926687706f8d626218  NucleoTPLPMVA_CORRIGIDO_v4.py
          PINS
          sha256sum -c pins.sha256
      - name: tpl_cadeia.py (autoteste 10/10)
        run: python -I tpl_cadeia.py
      - name: tpl_malha_v0_3.py (autoteste 14/14)
        run: python -c "import tpl_malha_v0_3 as m; n = m.autoteste(); print('AUTOTESTE_TPL_MALHA_V0_3:', n, '/ 14'); assert n == 14"
      - name: tpl_arbitro_v3.py (autoteste 42/42)
        run: python -I tpl_arbitro_v3.py autoteste
      - name: NucleoTPLPMVA_CORRIGIDO_v4.py (self-test 15/15)
        run: |
          pip install numpy scipy
          wc -c NucleoTPLPMVA_CORRIGIDO_v4.py
          python -I NucleoTPLPMVA_CORRIGIDO_v4.py --self-test
      - name: pins dos pendentes (tpl_fala, harness_redis_nx_v3, tpl_lacunas)
        run: |
          cat > pend.sha256 <<'PINS'
          cbf14125050b04893c83abba3e94ed1501df8df7d023071b91df0fec34791c21  tpl_fala.py
          cef9b2ff11bcb9bd487b2c3bd92419a5ae26bdd1f1a6ebad2cba252c0e4f4012  harness_redis_nx_v3.py
          8aacd51914c6261c8b84064a703d7874f5f58558cc40f1a0ce876f4dda3a2343  tpl_lacunas.py
          PINS
          sha256sum -c pend.sha256
      - name: tpl_fala.py (autoteste 10/10)
        run: |
          python -I tpl_fala.py autoteste | tee fala.txt
          grep -x "ESTADO: PROVADO (10/10)" fala.txt
      - name: tpl_lacunas.py (autoteste 6/6)
        run: |
          python -I tpl_lacunas.py autoteste | tee lac.txt
          grep -x "ESTADO: PROVADO (6/6)" lac.txt
      - name: harness_redis_nx_v3.py (Redis real 8/8)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq redis-server
          sudo systemctl stop redis-server || true
          python -m venv vr && vr/bin/pip install -q --require-hashes -r requirements-redis.txt
          vr/bin/python -I harness_redis_nx_v3.py | tee redis.txt
          grep -x "ESTADO: PROVADO com Redis real (8/8)" redis.txt
      - name: tpl_sintaxe.py (autoteste 10/10)
        run: python -I tpl_sintaxe.py autoteste
      - name: estado canonico (todo hash do tpl_estado.json confere com os arquivos)
        run: python -I tpl_sintaxe.py estado
      - name: acervo (pins + autoteste 10/10)
        run: |
          cat > acv.sha256 <<'PINS'
          78e77a342470a1626d7fef3edda8c411819a026c7eda31416c3d93d32f101632  acervo/acervo_tpl.py
          b0472bfbe7b257d2cecb5346efb61a80df72a129ac87e8600458279cb950f277  acervo/checar_base.py
          945f55acc2e9e3ddcfa41849bafa0aaf5db67d69b8113333c51790d447f2a854  acervo/indice_publico.txt
          PINS
          sha256sum -c acv.sha256
          python -I acervo/acervo_tpl.py autoteste | tee acv.txt
          grep -x "ESTADO: PROVADO (10/10)" acv.txt
      - name: base ligada ao acervo (8/8)
        run: |
          python -I acervo/checar_base.py acervo/indice_publico.txt tpl_cadeia.py tpl_malha_v0_3.py tpl_arbitro_v3.py NucleoTPLPMVA_CORRIGIDO_v4.py tpl_fala.py tpl_lacunas.py harness_redis_nx_v3.py tpl_sintaxe.py | tee base.txt
          grep -x "ESTADO: BASE LIGADA AO ACERVO (8/8)" base.txt
      - name: bateria3.py (pin + 3 linhas seladas em 29/10 19:39)
        run: |
          echo "205b0cae54fe408d3d99083be47da79a78d39ff0d13e41917a87ef011a557bff  bateria3.py" | sha256sum -c
          python -I bateria3.py | tee b3.txt
          cat > b3_esperado.txt <<'B3'
          P=40 digitos=74 sha256=f6ccc39acf9c399f45702a6a59a98c2490b243b46bb85894c18026fe596e9686
          P=120 digitos=227 sha256=e8ba6528b517d804ee3df5c7e8ea396d55ff1be157a7185522d7383176c49d66
          E40_cubo digitos=222 sha256=e9cd12e60b57efbbbb74c52e198c40986e1e359185b60106fdf3953233f96f54
          B3
          diff b3_esperado.txt b3.txt
      - name: tpl_curto.py (pin + resultado selado)
        run: |
          echo "2595c19bc3fa6d905c6549ebbde88d35aa8ad0d82afc93ab896f442d8da63db9  tpl_curto.py" | sha256sum -c
          python -I tpl_curto.py | tee curto.txt
          grep -x "resultado_sha256: f68601e2c3d8920f49fffff21d871939aad6094c335aabe217a873d78b272260" curto.txt
      - name: tpl_phi_omega_portal.py (pin + tabela selada em 30/10 07:20)
        run: |
          echo "4972d64d0187b9c2092b79ce9019332a5d517f4affdd3ba09c252ced0a51dd68  tpl_phi_omega_portal.py" | sha256sum -c
          python -m pip install -q sympy==1.14.0
          python -I tpl_phi_omega_portal.py | tee portal.txt
          grep -x "sha256_tabela=a534eb69febcbe2f1243c6ebea177dd2dbfc4b96c88b162ff83f39149e9dc8e9" portal.txt
      - name: resumo da medicao deste no
        run: |
          {
            sha256sum NucleoTPLPMVA_CORRIGIDO_v4.py tpl_arbitro_v3.py tpl_cadeia.py tpl_malha_v0_3.py tpl_fala.py tpl_lacunas.py harness_redis_nx_v3.py tpl_sintaxe.py
            cat fala.txt lac.txt acv.txt base.txt
            grep -x "ESTADO: PROVADO com Redis real (8/8)" redis.txt
            cat b3.txt curto.txt portal.txt
          } > malha_${{ matrix.python }}_${{ matrix.arch }}.txt
          cat malha_${{ matrix.python }}_${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v4
        with: {name: "malha-${{ matrix.python }}-${{ matrix.arch }}", path: "malha_${{ matrix.python }}_${{ matrix.arch }}.txt"}
  malha:
    name: juiz
    needs: nos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {merge-multiple: true}
      - name: os 8 nos mediram a mesma coisa
        run: |
          ls malha_*.txt
          test "$(ls malha_*.txt | wc -l)" -eq 8
          for f in malha_*.txt; do diff malha_3.12_x64.txt "$f"; done
          echo "MALHA DOBRADA: MESMA_MEDICAO em 8 nos (Python 3.11-3.14 x CPU x64 e ARM64)"
