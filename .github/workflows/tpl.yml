name: TPL
on: [push, workflow_dispatch]
jobs:
  medir:
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-latest, windows-latest, macos-latest]}
    runs-on: ${{ matrix.os }}
    env: {PYTHONUTF8: "1", PYTHONIOENCODING: "utf-8"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python tpl_curto.py > curto_${{ matrix.os }}.txt
      - uses: actions/upload-artifact@v4
        with: {name: "r-${{ matrix.os }}", path: "curto_${{ matrix.os }}.txt"}
  comparar:
    needs: medir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {merge-multiple: true}
      - run: |
          cat curto_*.txt
          test "$(grep -h '^resultado_sha256' curto_*.txt | tr -d '\r' | sort -u | wc -l)" -eq 1 && echo "MESMA_MEDICAO nas 3 máquinas"
