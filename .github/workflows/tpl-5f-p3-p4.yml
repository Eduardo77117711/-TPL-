name: tpl-5f-p3-p4
on:
  push:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  p3-p4:
    name: P3/P4 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify P3/P4 SHA-256 manifest
        run: sha256sum --check TPL_5F_P3_P4_SHA256SUMS.txt
      - name: Run P3 tests
        run: python -I -X utf8 -c "import runpy,sys; sys.path.insert(0,'.'); runpy.run_path('test_tpl_5f_p3.py',run_name='__main__')"
      - name: Run P4 tests
        run: python -I -X utf8 -c "import runpy,sys; sys.path.insert(0,'.'); runpy.run_path('test_tpl_5f_p4_neutron_constraint.py',run_name='__main__')"
